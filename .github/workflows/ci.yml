# CI pipeline for the heart-disease MLOps project.
#
#   lint ──► test ──► train ──► docker ──► k8s (+ monitoring)
#
# * lint  : flake8 on all Python code (fails fast, ~20 s)
# * test  : 70 unit, integration and API tests with coverage; JUnit + coverage
#           reports uploaded as artifacts
# * train : verifies the dataset checksum, cleans the data, trains and
#           tracks all models with MLflow, enforces a model quality gate,
#           scores a sample patient, uploads model + reports + mlruns
# * docker: builds the API image with the model trained in this run, runs
#           the container, waits for the HEALTHCHECK, smoke-tests every
#           endpoint, and on pushes to main publishes the image to GHCR
# * k8s   : creates a throw-away Kubernetes cluster (kind), deploys the image
#           with the same manifests used on the laptop (k8s/local overlay),
#           waits for the rollout, smoke-tests through the Service, then
#           performs a rolling update and a rollback; finally deploys
#           Prometheus + Grafana (k8s/monitoring), generates traffic and
#           verifies that the pods are scraped, the alert rules are loaded
#           and the Grafana dashboard is provisioned
#
# Any failing step fails the job, and later jobs do not run.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "screenshots/**"
      - "docs/**"
      - "**/*.md"
      - "**/*.docx"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  MPLBACKEND: Agg

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install flake8
        run: pip install flake8==7.1.1

      - name: Run flake8
        run: flake8 src scripts tests api --count --show-source --statistics

  test:
    name: Unit & integration tests
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest with coverage
        run: |
          mkdir -p test-reports
          pytest -v \
            --junitxml=test-reports/junit.xml \
            --cov=src --cov=api --cov-report=term \
            --cov-report=xml:test-reports/coverage.xml \
            --cov-report=html:test-reports/coverage-html

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: test-reports/
          retention-days: 30

  train:
    name: Train, track & validate model
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify dataset (checksum against manifest)
        run: python scripts/download_data.py

      - name: Clean data
        run: python -m src.data_processing

      - name: Train models and log to MLflow
        run: python -m src.train

      - name: Model quality gate
        run: python scripts/check_model.py

      - name: Smoke-test inference on sample patients
        run: python -m src.predict --input samples/sample_batch.json

      - name: Write job summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          import pandas as pd
          meta_path = pathlib.Path("models/metadata.json")
          cmp_path = pathlib.Path("reports/model_comparison.csv")
          if not meta_path.exists() or not cmp_path.exists():
              print("### Training did not produce a model")
              raise SystemExit
          meta = json.loads(meta_path.read_text())
          t = pd.read_csv(cmp_path, index_col=0)
          cols = ["cv_roc_auc_mean", "cv_roc_auc_std", "cv_recall_mean",
                  "test_roc_auc", "test_recall", "test_accuracy", "selected"]
          print(f"### Selected model: **{meta['model_label']}**\n")
          print(f"Dataset sha256 `{meta['dataset_sha256']}` · "
                f"commit `{meta['git_commit']}`\n")
          t = t[cols].round(3)
          print("| model | " + " | ".join(cols) + " |")
          print("|---" * (len(cols) + 1) + "|")
          for name, row in t.iterrows():
              print(f"| {name} | " + " | ".join(str(v) for v in row) + " |")
          EOF

      - name: Upload model
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: model
          path: |
            models/model.joblib
            models/metadata.json
          retention-days: 30

      - name: Upload reports and MLflow runs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: training-reports
          path: |
            reports/model_comparison.csv
            reports/figures/1*.png
            mlruns/
          retention-days: 30

  docker:
    name: Build, run & smoke-test container
    needs: train
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_LOCAL: heart-api:ci
    steps:
      - uses: actions/checkout@v6

      - name: Use the model trained and validated in this run
        uses: actions/download-artifact@v7
        with:
          name: model
          path: models/

      - name: Show model packaged into the image
        run: python3 -c "import json; m=json.load(open('models/metadata.json')); print(m['model_name'], 'trained', m['trained_at_utc'])"

      - name: Build image
        run: docker build -t "$IMAGE_LOCAL" .

      - name: Run container
        run: docker run -d --name heart-api -p 8000:8000 "$IMAGE_LOCAL"

      - name: Smoke-test the running container
        run: python3 scripts/smoke_test_api.py --url http://localhost:8000 --wait 90

      - name: Wait for Docker HEALTHCHECK to report healthy
        run: |
          for i in $(seq 1 20); do
            status=$(docker inspect --format '{{.State.Health.Status}}' heart-api)
            echo "health: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 3
          done
          exit 1

      - name: Container logs
        if: always()
        run: docker logs heart-api || true

      - name: Image summary
        if: always()
        run: |
          {
            echo "### Docker image"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`$IMAGE_LOCAL\` |"
            echo "| Size | $(docker image inspect "$IMAGE_LOCAL" --format '{{.Size}}' | awk '{printf "%.0f MB", $1/1024/1024}') |"
            echo "| Health | $(docker inspect --format '{{.State.Health.Status}}' heart-api 2>/dev/null) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to GitHub Container Registry (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/heart-disease-api
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE_LOCAL" "$IMAGE:latest"
          docker tag "$IMAGE_LOCAL" "$IMAGE:sha-$SHORT_SHA"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:sha-$SHORT_SHA"
          {
            echo ""
            echo "**Published:** \`$IMAGE:sha-$SHORT_SHA\`, \`$IMAGE:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop container
        if: always()
        run: docker rm -f heart-api || true

  k8s:
    name: Deploy to Kubernetes (kind) & smoke-test
    needs: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KIND_VERSION: v0.31.0
      NS: heart-disease
    steps:
      - uses: actions/checkout@v6

      - name: Use the model trained and validated in this run
        uses: actions/download-artifact@v7
        with:
          name: model
          path: models/

      - name: Build image (heart-api:local)
        run: docker build -t heart-api:local .

      - name: Validate Prometheus config and unit-test alert rules (promtool)
        run: |
          PROM=prom/prometheus:v3.5.0
          docker run --rm -v "$PWD/k8s/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool "$PROM" check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/k8s/monitoring/prometheus:/etc/prometheus:ro" \
            -w /etc/prometheus --entrypoint promtool "$PROM" test rules alert-rules.test.yml

      - name: Install kind
        run: |
          curl -sSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          chmod +x kind && sudo mv kind /usr/local/bin/kind
          kind version
          kubectl version --client

      - name: Create cluster
        run: |
          kind create cluster --name heart --wait 120s
          kubectl get nodes -o wide

      - name: Load image into the cluster
        run: kind load docker-image heart-api:local --name heart

      - name: Deploy manifests (kubectl apply -k k8s/local/)
        run: kubectl apply -k k8s/local/

      - name: Wait for rollout
        run: kubectl -n "$NS" rollout status deployment/heart-api --timeout=180s

      - name: Show resources
        run: kubectl -n "$NS" get deploy,rs,pods,svc,hpa,pdb,endpointslices -o wide

      - name: Smoke-test through the Service
        run: |
          kubectl -n "$NS" port-forward svc/heart-api 8080:8080 > pf.log 2>&1 &
          python3 scripts/smoke_test_api.py --url http://localhost:8080 --wait 60

      - name: Rolling update and rollback
        run: |
          # new revision (same image, new pod template) -> zero-downtime update
          kubectl -n "$NS" rollout restart deployment/heart-api
          kubectl -n "$NS" rollout status deployment/heart-api --timeout=180s
          # go back to the previous revision
          kubectl -n "$NS" rollout undo deployment/heart-api
          kubectl -n "$NS" rollout status deployment/heart-api --timeout=180s
          kubectl -n "$NS" rollout history deployment/heart-api

      - name: Deploy monitoring (Prometheus + Grafana)
        run: |
          kubectl apply -k k8s/monitoring/
          kubectl -n monitoring rollout status deployment/prometheus --timeout=300s
          kubectl -n monitoring rollout status deployment/grafana --timeout=300s
          kubectl -n monitoring get deploy,pods,svc

      - name: Generate traffic and verify monitoring end to end
        run: |
          kubectl -n "$NS" port-forward svc/heart-api 8081:8080 > pf-api.log 2>&1 &
          kubectl -n monitoring port-forward svc/prometheus 9090:9090 > pf-prom.log 2>&1 &
          kubectl -n monitoring port-forward svc/grafana 3000:3000 > pf-grafana.log 2>&1 &
          sleep 5
          python3 scripts/load_test.py --url http://localhost:8081 -n 300 -c 4
          python3 scripts/load_test.py --url http://localhost:8081 -n 60 -c 2 --invalid 0.3
          sleep 15   # let Prometheus scrape the new samples (5 s interval)
          python3 scripts/check_monitoring.py --prometheus http://localhost:9090 \
            --grafana http://localhost:3000 --min-targets 2 --wait 120 | tee monitoring-check.txt

      - name: Diagnostics
        if: always()
        run: |
          kubectl -n "$NS" get events --sort-by=.lastTimestamp | tail -30 || true
          kubectl -n "$NS" describe deployment heart-api || true
          kubectl -n "$NS" logs -l app.kubernetes.io/name=heart-api --tail=30 --prefix || true
          kubectl -n monitoring get events --sort-by=.lastTimestamp | tail -30 || true
          kubectl -n monitoring logs deployment/prometheus --tail=30 || true
          kubectl -n monitoring logs deployment/grafana --tail=30 || true

      - name: Kubernetes summary
        if: always()
        run: |
          {
            echo "### Kubernetes deployment (kind)"
            echo ""
            echo '```'
            kubectl -n "$NS" get deploy,pods,svc -o wide 2>&1 || true
            echo '```'
            echo ""
            echo "### Monitoring (Prometheus + Grafana)"
            echo ""
            echo '```'
            kubectl -n monitoring get deploy,pods 2>&1 || true
            echo ""
            cat monitoring-check.txt 2>/dev/null || echo "monitoring check did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete cluster
        if: always()
        run: kind delete cluster --name heart || true
