# Provisioned automatically when Grafana starts: no manual setup in the UI.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus.monitoring.svc.cluster.local:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s        # matches the scrape interval ($__rate_interval)
      httpMethod: POST
