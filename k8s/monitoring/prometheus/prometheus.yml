# Prometheus configuration (mounted from a ConfigMap generated by
# k8s/monitoring/kustomization.yaml). Also validated in CI with
# `promtool check config`.
global:
  scrape_interval: 5s          # short interval so the demo dashboards react quickly
  evaluation_interval: 5s
  external_labels:
    cluster: local

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  # Every heart-api pod is discovered through the Kubernetes API and scraped
  # individually (not through the Service), so per-pod metrics are kept and
  # pods added by the autoscaler appear automatically.
  - job_name: heart-api
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [heart-disease]
    relabel_configs:
      # only pods that opt in with the annotation prometheus.io/scrape: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        regex: "true"
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      # only Ready pods (the same pods the Service sends traffic to), so pods
      # that are still starting or already shutting down are not reported down
      - source_labels: [__meta_kubernetes_pod_ready]
        regex: "true"
        action: keep
      # path and port from the prometheus.io/path and prometheus.io/port annotations
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        regex: (.+)
        target_label: __metrics_path__
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      # readable labels on every series
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        target_label: app

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
