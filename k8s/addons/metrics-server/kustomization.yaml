# metrics-server: provides CPU/memory metrics for `kubectl top` and the HPA.
# Docker Desktop and kind do not ship it.
#
#   kubectl apply -k k8s/addons/metrics-server/
#
# --kubelet-insecure-tls is needed on local clusters (Docker Desktop, kind)
# whose kubelet serving certificates are self-signed. Do not use it on a
# production cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.8.1/components.yaml
patches:
  - target:
      kind: Deployment
      name: metrics-server
      namespace: kube-system
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubelet-insecure-tls
