# During voluntary disruptions (node drain, cluster upgrade) keep at least one
# pod serving.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: heart-api
  namespace: heart-disease
  labels:
    app.kubernetes.io/name: heart-api
    app.kubernetes.io/part-of: heart-disease-mlops
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: heart-api
