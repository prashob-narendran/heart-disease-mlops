# Scales between 2 and 5 pods to keep average CPU at ~60 % of the request.
# Requires metrics-server: kubectl apply -k k8s/addons/metrics-server/
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: heart-api
  namespace: heart-disease
  labels:
    app.kubernetes.io/name: heart-api
    app.kubernetes.io/part-of: heart-disease-mlops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: heart-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60   # scale down calmly after load stops
