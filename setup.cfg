[flake8]
max-line-length = 88
exclude = .venv,venv,mlruns,notebooks

[tool:pytest]
testpaths = tests
pythonpath = .
# Silence deprecation notices raised inside third-party libraries
# (mlflow 2.x still uses Pydantic v1-style validators; starlette's
# TestClient uses an old anyio alias). Our own code raises none.
filterwarnings =
    ignore::DeprecationWarning:mlflow.*
    ignore::DeprecationWarning:starlette.*
    ignore:Support for class-based `config` is deprecated:DeprecationWarning
